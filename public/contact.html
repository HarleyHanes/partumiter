<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collage Background</title>
    <link rel="stylesheet" href="style/style.css">
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="background-image"></div>
    <div class="foreground-content">
        <!-- Header Section -->
        <header class="fixed-header" id="fixed-header">
            <script src="header.js"></script>
        </header>
        <div class="main-content">
            <div class="contact-content">
            <form id="contactForm">
                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" required><br><br>
            
                <label for="message">Your Message:</label><br>
                <textarea id="message" name="message" required></textarea><br><br>
            
                <button type="submit", id = "sendButton">Send</button>
            </form>
                
            
            <!-- Right Content: Follow Us Box -->
            <div class="right-content">
                <h2>Follow Us</h2>
                <ul>
                    <li><a href="https://www.instagram.com/partum.iter/" target="_blank"><i class="fab fa-instagram"></i> Instagram</a></li>
                    <!-- <li><a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i> Facebook</a></li>
                    <li><a href="https://www.tiktok.com" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a></li> -->
                </ul>
            </div>
            </div>
            <!-- Script for sending email-->
            <script>
                document.getElementById('contactForm').addEventListener('submit', function(e) {
                  e.preventDefault(); // prevent page refresh
            
                  const email = document.getElementById('email').value;
                  const message = document.getElementById('message').value;
                  const sendButton = document.getElementById('sendButton');
	          
	          sendButton.disabled = true;

                  fetch('https://partumiter.com/send-email', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, message })
                  })
                  .then(response => {
                    if (!response.ok) {
                      throw new Error('Network response was not ok');
                    }
                    return response.json();
                  })
                  .then(data => {
                    alert('Message sent successfully! You should see an email from us in your mailbox. If not, please confirm the email address you provided or contact us over instagram.');
	            sendButton.textContent = "Message Sent";
                  })
                  .catch(error => {
		    sendButton.disabled = false;
                    console.error('Error:', error);
                    alert('Failed to send message. Please try again and contact us over instagram if the problem persists.');
                  });
                });
            </script>
    </div>
</body>
</html>
